name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install hash-locked validation tools
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-dev.txt
      - name: Validate skill packages and documentation links
        run: python scripts/validate_skills.py
      - name: Test the validation tooling
        run: python -m unittest discover -s tests -v

  security:
    name: Audit workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install hash-locked validation tools
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-dev.txt
      - name: Audit workflow and action definitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --strict-collection --persona=pedantic .
